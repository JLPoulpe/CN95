# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session:
        cookie_secure: auto
        cookie_httponly: true
        cookie_samesite: lax

    # « Mot de passe oublié » : limites par adresse IP et par compte (évite le harcèlement par mail et l'énumération)
    rate_limiter:
        mot_de_passe_oublie_ip:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        mot_de_passe_oublie_compte:
            policy: sliding_window
            limit: 3
            interval: '1 hour'

        # Envois en masse : 5 communications par heure et par auteur (limite les dégâts d'un compte compromis)
        envoi_communication:
            policy: sliding_window
            limit: 5
            interval: '1 hour'

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file

when@prod:
    framework:
        session:
            # Production : cookie de session uniquement sur HTTPS
            cookie_secure: true
        # Seul l'hôte de DEFAULT_URI est accepté : empêche un en-tête Host forgé de fausser les liens des mails
        trusted_hosts:
            - '^%env(key:host:url:DEFAULT_URI)%$'
